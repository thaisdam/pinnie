spring:
  application:
    name: pinnie
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  # ATENÇÃO: Configure a variável de ambiente JWT_SECRET! Em produção, a falta dessa variável causará falha na inicialização.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

app:
  security:
    cookie:
      secure: ${SECURE_COOKIE:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
