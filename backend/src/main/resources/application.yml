spring:
  application:
    name: pinnie
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/pinnie_db}
    username: ${DB_USERNAME:pinnie_user}
    password: ${DB_PASSWORD:pinnie_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

jwt:
  # ATENÇÃO: Nunca use esta chave padrão em produção. Configure a variável de ambiente JWT_SECRET!
  secret: ${JWT_SECRET:0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
  expiration: ${JWT_EXPIRATION:7200000}

app:
  security:
    cookie:
      secure: ${SECURE_COOKIE:false}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
